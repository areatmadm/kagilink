[package]
name = "areatm-own-window-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "KagiLink own-window input sink (D029 position): types a received synthetic value into a window this program creates itself, only while that window is the foreground window, and verifies the result by reading its own edit box back. Never targets other windows."

[dependencies]
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

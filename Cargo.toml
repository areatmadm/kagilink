[workspace]
members = ["core/phase0-model", "core/cpace-eval", "core/kagilink-core", "apps/windows/rust/tpm-probe", "apps/windows/rust/receiver", "apps/windows/rust/input-probe", "apps/windows/rust/own-window-input","core/kagilink-ffi"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
repository = "https://github.com/areatmadm/kagilink"
homepage = "https://key.minori.in"

# Release hardening (docs/FFI_DESIGN.md): abort on panic so no unwinding crosses the C ABI, keep
# overflow checks on in release, and build one codegen unit for reproducibility. No LTO: thin LTO broke
# `cargo build --release` on macOS arm64 with rustc 1.92.0 and zeroize 1.9.1 (zeroize_derive not found).
[profile.release]
panic = "abort"
overflow-checks = true
codegen-units = 1

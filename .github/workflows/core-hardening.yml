name: KagiLink core hardening checks (synthetic data only, D017/D019/D020)
# Read-only, no secrets, no pull_request_target. Third-party actions pinned by commit SHA.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  personal-ids:
    # D028: no personal identifiers (named signing identities, device UDIDs, private keys) in tracked files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Scan tracked files for personal identifiers
        run: sh tools/check-no-personal-ids.sh
  risk-notice-strings:
    # D023: the Android risk notice resources equal docs/RISK_NOTICE.md, no forbidden wording, version lock holds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check risk notice strings
        run: python3 tools/check-risk-notice-strings.py
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b
        with:
          tool: cargo-audit,cargo-deny
      - name: Known-advisory check on the lockfile
        run: cargo audit
      - name: Known-advisory check on the fuzz lockfile
        run: cargo audit --file core/kagilink-core/fuzz/Cargo.lock
      - name: Advisories, bans, licenses, sources
        run: cargo deny check
  aarch64-qemu:
    # Checks aarch64 code generation only. This is a normal Linux libc under qemu,
    # NOT Android: a pass here must not be reported as Android-verified (D020).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install toolchain, cross linker and qemu
        run: |
          rustup toolchain install 1.92.0 --profile minimal --target aarch64-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
      - name: Run core tests under qemu-aarch64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
        run: >
          cargo +1.92.0 test -p areatm-kagilink-core --release --locked
          --target aarch64-unknown-linux-gnu
  android-compile:
    # Compile-only evidence for the Android target. Test execution on a real device
    # is manual and run by the Android session (D020).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build core library for aarch64-linux-android
        run: |
          rustup toolchain install 1.92.0 --profile minimal --target aarch64-linux-android
          cargo +1.92.0 build -p areatm-kagilink-core --release --locked --target aarch64-linux-android
  c-consumer:
    # A real C program using only include/kagilink.h and the static library (D016).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build the FFI static library
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          cargo +1.92.0 build -p areatm-kagilink-ffi --release --locked
      - name: Exported symbols match the header exactly
        run: sh tools/check-ffi-exports.sh target/release/libareatm_kagilink_ffi.so
      - name: Compile and run the C consumer (strict warnings)
        run: |
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -Icore/kagilink-ffi/include \
            tests/c/consumer.c target/release/libareatm_kagilink_ffi.a \
            -lpthread -ldl -lm -o consumer
          ./consumer
      - name: Same program with AddressSanitizer and UBSan on the C side
        run: |
          gcc -std=c11 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Icore/kagilink-ffi/include tests/c/consumer.c \
            target/release/libareatm_kagilink_ffi.a -lpthread -ldl -lm -o consumer-asan
          ./consumer-asan
  cpp-consumer:
    # C++20 RAII wrapper (kagilink.hpp) over the C ABI, built with MSVC on Windows (D021).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Build library, compile and run the C++ consumer
        shell: pwsh
        run: |
          rustup default 1.92.0
          ./tests/cpp/run-cpp-consumer.ps1

[package]
name = "areatm-kagilink-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "KagiLink Phase 1 core: CPace handshake, key confirmation, HKDF key schedule, AES-256-GCM framing. Synthetic-data only until independent review (D012/D014)."

[dependencies]
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
hkdf = "=0.13.0"
hmac = "=0.13.0"
pakery-core = "=0.6.2"
pakery-cpace = "=0.6.2"
pakery-crypto = { version = "=0.6.2", default-features = false, features = ["ristretto255"] }
rand_core = "0.10"
sha2 = "=0.11.1"
subtle = "2.6"
zeroize = "1"
